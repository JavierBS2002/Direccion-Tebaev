<style>
  /* ===== Colores: azul marino institucional ===== */
  :root{
    --marino:#13315C; --marino2:#0B2545; --marino3:#1D4478; --marinoSuave:#E3EAF5;
    --cons:#0E7C7B; --consSuave:#DCF1EF;
    --ok:#1E6B45; --okSuave:#DFF1E7;
    --ambar:#8A4F0C; --ambarSuave:#FBEBD3; --ambarBorde:#E8B977;
    --fondo:#EEF2F8; --tinta:#18212B; --gris:#5A6475; --borde:#D6DEEA; --linea:#E9EEF5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--marino2);font-family:Figtree,system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,p{margin:0}
  .shell{display:flex;min-height:100vh}
  .lateral{display:none}
  .principal{flex:1;min-width:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--fondo);min-height:100vh}

  /* Barras y contenedores */
  .barra{background:var(--marino);color:#fff;padding:12px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
  .barra h1{font-size:20px;font-weight:800;flex:1}
  .btn-icono{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:inherit;flex:none}
  .btn-icono:hover{background:rgba(255,255,255,.12)}
  .contenido{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
  .etiqueta{font-size:13px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px}
  .sub{font-size:13px;color:var(--gris)}
  .vacio{padding:24px 16px;text-align:center;color:var(--gris);font-size:15px}

  /* Botones */
  .btn{border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .primario{background:var(--marino);color:#fff}
  .primario:hover{background:var(--marino2)}
  .borde{background:#fff;color:var(--marino);border:2px solid var(--marino)}
  .grande{min-height:56px;font-size:17px;font-weight:800;width:100%}
  .enlace{border:0;background:transparent;color:var(--marino3);font-weight:700;font-size:14px;min-height:44px;padding:0 6px}
  .btn-blanco{background:#fff;color:var(--marino);border:0;font-weight:800}
  .btn-contorno{background:transparent;border:2px solid rgba(255,255,255,.55);color:#fff}

  /* Campos */
  .campo{display:flex;flex-direction:column;gap:6px}
  .campo>span{font-size:13px;font-weight:700;color:var(--gris)}
  .campo input{height:48px;border-radius:12px;border:1px solid #C3CEDF;background:#fff;padding:0 14px;font-size:15px;width:100%}
  input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--marino3);outline-offset:2px}
  .buscador{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 14px;height:48px;color:var(--gris)}
  .buscador input{border:0;background:transparent;font-size:15px;flex:1;outline:none;min-width:0;color:var(--tinta)}
  .monto{display:flex;align-items:center;height:52px;border-radius:12px;background:#fff;padding:0 14px;gap:6px;border:2px solid var(--marino)}
  .monto.cons{border-color:var(--cons)}
  .monto b{font-size:18px;color:var(--gris)}
  .monto input{border:0;outline:none;font-size:19px;font-weight:800;flex:1;min-width:0;background:transparent}
  .casilla{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
  .casilla input{width:22px;height:22px;accent-color:var(--marino)}

  /* Chips, segmentos y opciones */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
  .chip.activo{background:#fff;color:var(--marino);font-weight:800}
  .chip.ambar{border-color:var(--ambarBorde);color:#FFD9A3}
  .chip.ambar.activo{background:var(--ambarSuave);color:var(--ambar)}
  .segmento{display:flex;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:4px;gap:4px}
  .segmento button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:var(--gris);font-size:14px;font-weight:600}
  .segmento button.activo{background:var(--marino);color:#fff;font-weight:800}
  .dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .opcion{min-height:52px;border-radius:12px;border:1px solid #C3CEDF;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center}
  .opcion b{font-size:14px}
  .opcion small{font-size:11px;font-weight:600;color:var(--gris)}
  .opcion.activo{border:2px solid var(--marino);background:var(--marinoSuave);color:var(--marino)}
  .opcion.activo small{color:var(--marino)}
  .opcion.activo-cons{border:2px solid var(--cons);background:var(--consSuave);color:var(--cons)}
  .opcion.activo-cons small{color:var(--cons)}

  /* Listas y estados */
  .fila{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;width:100%;text-align:left;border-bottom:1px solid var(--linea)}
  .fila:last-child{border-bottom:0}
  button.fila:hover{background:#F7F9FC}
  .fila .txt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .fila .nombre{font-size:15px;font-weight:700}
  .fila .monto-der{font-size:15px;font-weight:800;white-space:nowrap}
  .avatar{width:40px;height:40px;border-radius:20px;background:var(--marinoSuave);color:var(--marino);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
  .cuadro{min-width:36px;height:36px;padding:0 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
  .estados{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .estado{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
  .ok{background:var(--okSuave);color:var(--ok)}
  .debe{background:var(--ambarSuave);color:var(--ambar)}
  .marinito{background:var(--marinoSuave);color:var(--marino)}
  .consito{background:var(--consSuave);color:var(--cons)}

  /* Logo */
  .logo{background:#fff;border-radius:22%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .logo img{width:86%;height:86%;object-fit:contain}

  /* Inicio */
  .cabecera{background:var(--marino);color:#fff;padding:18px 16px 64px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(circle at 100% 0,rgba(255,255,255,.08) 0,rgba(255,255,255,0) 55%)}
  .cabecera .arriba{display:flex;align-items:center;gap:12px}
  .cabecera .escuela{flex:1;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
  .cabecera h1{font-size:28px;font-weight:800;margin-top:12px}
  .cabecera p{font-size:15px;opacity:.88}
  .resumen{margin:-44px 16px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .resumen .tarjeta{padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(11,37,69,.14);border:0}
  .resumen .cifra{font-size:25px;font-weight:800}
  .acceso{background:#fff;color:var(--tinta);border-radius:16px;min-height:88px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:700;border:1px solid var(--borde)}
  .acceso:hover{border-color:var(--marino)}
  .acceso-grande{background:var(--marino);color:#fff;border:0;border-radius:16px;min-height:64px;padding:0 18px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;width:100%}
  .acceso-grande:hover{background:var(--marino2)}
  .inicio-grid,.rep-grid{display:flex;flex-direction:column;gap:16px}
  .col{display:flex;flex-direction:column;gap:16px}

  /* Cobro */
  .seccion{background:#fff;border-radius:14px;border:1px solid var(--borde);overflow:hidden}
  .seccion.on-marino{border:2px solid var(--marino)}
  .seccion.on-cons{border:2px solid var(--cons)}
  .seccion-cab{width:100%;min-height:62px;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left}
  .check{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid #C3CEDF;background:#fff}
  .on-marino .check{background:var(--marino);border-color:var(--marino)}
  .on-cons .check{background:var(--cons);border-color:var(--cons)}
  .seccion-cuerpo{padding:12px 14px 14px;border-top:1px solid var(--borde);display:flex;flex-direction:column;gap:12px}
  .entrega .opcion{min-height:76px;gap:4px}
  .caja-correo{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .pie{background:#fff;border-top:1px solid var(--borde);padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;box-shadow:0 -6px 16px rgba(11,37,69,.06)}
  .renglon{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

  /* Recibo (fondo azul marino) */
  .recibo-fondo{background:var(--marino2);min-height:100vh;padding:20px 16px 28px}
  .recibo-col{display:flex;flex-direction:column;gap:14px;width:100%;max-width:540px;margin:0 auto}
  .recibo{background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .datos div{display:flex;flex-direction:column;gap:2px}
  .datos span{font-size:12px;color:var(--gris)}
  .datos b{font-size:15px;font-weight:600}
  .sello{align-self:center;border:3px solid var(--marino);color:var(--marino);border-radius:10px;padding:4px 18px;font-weight:800;font-size:20px;letter-spacing:3px}
  .digital{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .digital h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--marino)}
  .estado-envio{border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
  .estado-envio.ok{background:var(--okSuave);color:var(--ok)}
  .estado-envio.mal{background:var(--ambarSuave);color:var(--ambar)}

  /* Reportes */
  .barra-avance{height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
  .barra-avance div{height:10px;border-radius:5px}

  /* Movimientos */
  .dia{font-size:13px;font-weight:800;color:var(--marino);text-transform:uppercase;letter-spacing:.05em;padding:6px 2px 0}
  .mov{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--linea);align-items:flex-start}
  .mov:last-child{border-bottom:0}
  .mov .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
  .mov .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .mov .titulo{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mov .titulo b{font-size:15px}
  .mov .hora{font-size:13px;color:var(--gris);font-weight:700;white-space:nowrap}
  .mov .det{font-size:13px;color:var(--tinta);overflow-wrap:anywhere}
  .mov .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip-claro{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--borde);background:#fff;font-size:13px;font-weight:600;white-space:nowrap;flex:none;color:var(--tinta)}
  .chip-claro.activo{background:var(--marino);border-color:var(--marino);color:#fff;font-weight:800}
  .chip-claro span{opacity:.7;margin-left:4px}

  /* Consultar y reimprimir */
  .veredicto{border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
  .veredicto.al-corriente{background:var(--okSuave);color:var(--ok)}
  .veredicto.con-adeudo{background:var(--ambarSuave);color:var(--ambar);border:1px solid var(--ambarBorde)}
  .ticket-fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linea)}
  .ticket-fila .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .btn-chico{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}

  /* Modo sin conexión */
  .conexion{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;font-weight:700}
  .conexion svg{flex:none}
  .conexion.fuera{background:#8E2A2A;color:#fff}
  .conexion.pend{background:var(--ambarSuave);color:var(--ambar);border-bottom:1px solid var(--ambarBorde)}
  .conexion button{margin-left:auto;min-height:36px;border-radius:10px;border:0;padding:0 12px;font-weight:800;background:#fff;color:var(--ambar)}
  .provisional{background:var(--ambarSuave);color:var(--ambar);border:1px solid var(--ambarBorde);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4}

  /* Entrada (fondo azul marino) */
  .login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;padding:32px 24px;background:var(--marino2);color:#fff;
         background-image:radial-gradient(circle at 50% 0,rgba(255,255,255,.10) 0,rgba(255,255,255,0) 60%)}
  .login>*{width:100%;max-width:400px}
  .login .marca{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .login h1{font-size:28px;font-weight:800}
  .login form{background:#fff;color:var(--tinta);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}

  /* Carga, avisos y ventanas */
  .cargando{position:fixed;inset:0;background:rgba(11,37,69,.35);display:none;align-items:center;justify-content:center;z-index:50}
  .giro{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.5);border-top-color:#fff;animation:girar .8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:440px;width:calc(100% - 32px);background:var(--marino2);color:#fff;padding:14px 16px;border-radius:14px;font-weight:600;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .aviso.error{background:#8E2A2A}
  .oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #modal{display:none}
  .modal-fondo{position:fixed;inset:0;background:rgba(11,37,69,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:#fff;width:100%;max-width:560px;max-height:94vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .modal.pdf{height:94vh;max-width:900px}
  .modal-cab{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;background:var(--marino);color:#fff}
  .modal-cab b{flex:1;font-size:17px}
  .modal-cuerpo{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
  .visor{flex:1;width:100%;border:0;background:#F1F3F6}
  .modal-pie{display:flex;gap:8px;padding:12px;border-top:1px solid var(--borde);flex-wrap:wrap}
  .modal-pie .btn{flex:1 1 140px}

  /* ===== Versión página web (computadora / tableta horizontal) ===== */
  @media (min-width: 900px){
    .lateral{display:flex;flex-direction:column;gap:4px;width:264px;flex:none;background:var(--marino2);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh}
    .lateral .marca{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
    .lateral .marca b{font-size:16px}
    .lateral .marca span{font-size:12px;opacity:.8}
    .menu{width:100%;min-height:46px;border:0;border-radius:12px;background:transparent;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:15px;font-weight:600;text-align:left}
    .menu:hover{background:rgba(255,255,255,.08)}
    .menu.activo{background:#fff;color:var(--marino);font-weight:800}
    .lateral .usuario{margin-top:auto;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:6px;font-size:14px}
    .principal{max-width:none;margin:0}
    .contenido{padding:28px 36px;max-width:1140px;width:100%;margin:0 auto}
    .angosto .contenido{max-width:780px}
    .barra{padding:14px 28px}
    .barra-filtros{padding:0 36px 16px !important}
    .solo-movil{display:none !important}
    .cabecera{padding:30px 36px 80px}
    .cabecera .arriba{justify-content:flex-end}
    .cabecera h1{font-size:34px;margin-top:0}
    .resumen{max-width:1068px;width:calc(100% - 72px);margin:-50px auto 0;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .inicio-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:start;gap:24px}
    .rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:20px}
    #lista{display:grid !important;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));padding:16px 36px 28px !important}
    #conteo{padding:16px 36px 0 !important}
    .pie{padding:14px max(16px, calc((100% - 780px) / 2)) 18px}
    .modal-fondo{align-items:center;padding:24px}
    .modal{border-radius:18px}
  }
</style>

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const dinero = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
function esc(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function iniciales(n) { return String(n || '').trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase(); }
function hoyISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function guardarLocal(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
const correoValido = c => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(c || '').trim());

function cargando(si) { $('#cargando').style.display = si ? 'flex' : 'none'; }
let tAviso;
function aviso(msg, error) {
  const a = $('#aviso'); a.textContent = msg; a.className = 'aviso' + (error ? ' error' : ''); a.style.display = 'block';
  clearTimeout(tAviso); tAviso = setTimeout(() => a.style.display = 'none', 4000);
}

// Llama a una función de Código.gs. Devuelve null si hubo error.
function api(fn, ...args) {
  S.ultimoErrorRed = false;
  cargando(true);
  return new Promise(res => {
    google.script.run
      .withSuccessHandler(r => { cargando(false); res(r); })
      .withFailureHandler(e => {
        cargando(false);
        const m = (e && e.message) || String(e);
        S.ultimoErrorRed = esErrorRed(m);
        if (m.indexOf('SESION') >= 0) { salirLocal(); aviso('Su sesión terminó. Ingrese su PIN de nuevo.', true); }
        else if (S.ultimoErrorRed) aviso('Sin conexión a internet.', true);
        else aviso(m, true);
        res(null);
      })[fn](...args);
  });
}

function barra(titulo, volver, extra) {

/* =================================================================
 * NAVEGACIÓN
 * ================================================================= */
function ir(vista) { if (typeof cerrarModal === 'function') cerrarModal(); S.vista = vista; pintar(); window.scrollTo(0, 0); }

function pintar() {
  const v = { login: vLogin, inicio: vInicio, alumnos: vAlumnos, ficha: vFicha, cobro: vCobro,
              recibo: vRecibo, reportes: vReportes, config: vConfig, movimientos: vMovimientos, consulta: vConsulta }[S.vista];
  if (S.vista === 'login' || S.vista === 'recibo' || !S.datos) {
    $('#app').innerHTML = (S.vista === 'login' ? '' : barraConexion()) + v();
  } else {
    const angosto = ['cobro', 'config', 'ficha', 'movimientos', 'consulta'].includes(S.vista) ? ' angosto' : '';
    $('#app').innerHTML = `<div class="shell">${menuLateral()}<main class="principal${angosto}">${barraConexion()}${v()}</main></div>`;
  }
  if (S.vista === 'alumnos') pintarLista();
  if (S.vista === 'cobro') actualizarTotal();
  if (S.vista === 'consulta') pintarConsulta();
}

// Menú lateral (se ve en computadora)
function menuLateral() {
  const admin = S.usuario.rol === 'admin';
  const act = v => (S.vista === v || (v === 'alumnos' && S.vista === 'ficha')) ? ' activo' : '';
  const c = S.datos.config;
  return `<aside class="lateral" aria-label="Menú">
    <div class="marca">${logoHTML(84)}<b>${esc(c.escuela)}</b><span>CCT ${esc(c.cct)} · Ciclo ${esc(c.ciclo)}</span></div>
    <button class="menu${act('inicio')}" onclick="ir('inicio')">${I.casa()} Inicio</button>
    <button class="menu${act('cobro')}" onclick="elegirParaCobro()">${I.mas(20)} Registrar cobro</button>
    <button class="menu${act('consulta')}" onclick="abrirConsulta()">${I.buscar(20)} Consultar / reimprimir</button>
    <button class="menu${act('alumnos')}" onclick="abrirAlumnos(false)">${I.alumnos(20)} Alumnos</button>
    <button class="menu${act('movimientos')}" onclick="abrirMovimientos()">${I.lista()} Movimientos</button>
    ${admin ? `<button class="menu${act('reportes')}" onclick="abrirReportes()">${I.reportes(20)} Reportes</button>
    <button class="menu${act('config')}" onclick="ir('config')">${I.ajustes(20)} Cuotas y fechas</button>` : ''}
    <div class="usuario"><span style="opacity:.8">Sesión de</span><b>${esc(S.usuario.nombre)}</b>
      <button class="menu" onclick="salir()" style="padding:0 8px">${I.salir(20)} Cerrar sesión</button></div>
  </aside>`;
}

/* ---------- Ventanas: visor de PDF y correo ---------- */
function abrirModal(html, clase) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-fondo" onclick="if(event.target===this)cerrarModal()">
    <div class="modal ${clase || ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  m.style.display = 'block';
}
function cerrarModal() { const m = $('#modal'); m.innerHTML = ''; m.style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
const cabModal = t => `<div class="modal-cab"><b>${esc(t)}</b><button class="btn-icono" onclick="cerrarModal()" aria-label="Cerrar">${I.cerrar()}</button></div>`;

function mostrarPDF(p, titulo, extra) {
  abrirModal(`${cabModal(titulo)}
    <iframe class="visor" src="${esc(p.vista)}" title="${esc(titulo)}"></iframe>
    <div class="modal-pie">
      <a class="btn primario" href="${esc(p.url)}" target="_blank" rel="noopener">${I.impresora(20)} Imprimir / descargar</a>
      ${extra || ''}
    </div>`, 'pdf');
}

 * ARRANQUE Y SESIÓN
 * ================================================================= */
// Datos de la última vez guardados en el equipo: la app abre al instante (aunque no haya internet)
// y se actualizan por detrás. Se borran al cerrar sesión.
const DATOS_LOCAL = 'cobros_datos';
function guardarDatosLocal(d) { try { if (d && S.token) localStorage.setItem(DATOS_LOCAL, JSON.stringify({ k: S.token, t: Date.now(), d: d })); } catch (e) {} }
function leerDatosLocal(t) {
  try { const x = JSON.parse(localStorage.getItem(DATOS_LOCAL) || 'null'); return x && x.k === t && Date.now() - x.t < 3 * 864e5 ? x.d : null; } catch (e) { return null; }
}
window.addEventListener('load', async () => {
  try { S.publico = JSON.parse(leerLocal('cobros_publico') || 'null') || null; } catch (e) { S.publico = null; }
  const t = leerLocal('cobros_token');
  const previos = t ? leerDatosLocal(t) : null;
  if (previos) {
    // Abre al instante con lo guardado y actualiza por detrás
    S.publico = S.publico || {}; S.token = t; S.datos = previos; S.usuario = previos.usuario; ir('inicio');
    google.script.run.withSuccessHandler(p => { if (p) { S.publico = p; guardarLocal('cobros_publico', JSON.stringify(p)); } }).withFailureHandler(() => {}).obtenerPublico();
    google.script.run.withSuccessHandler(d => { if (!S.token) return; S.datos = d; S.usuario = d.usuario; guardarDatosLocal(d); if (S.vista === 'inicio' || S.vista === 'alumnos') pintar(); sincronizar(); })
      .withFailureHandler(e => { const m = (e && e.message) || String(e); if (m.indexOf('SESION') >= 0) { salirLocal(); aviso('Su sesión terminó. Ingrese su PIN de nuevo.', true); } })
      .obtenerInicio(t);
    return;
  }
  const pub = await api('obtenerPublico');
  if (pub) { S.publico = pub; guardarLocal('cobros_publico', JSON.stringify(pub)); } else S.publico = S.publico || {};
  if (t) { S.token = t; const d = await api('obtenerInicio', t); if (d) { S.datos = d; S.usuario = d.usuario; guardarDatosLocal(d); ir('inicio'); return sincronizar(); } }
  ir('login');
});

async function entrar(ev) {
  ev.preventDefault();
  const r = await api('iniciarSesion', $('#pin').value);
  if (!r) return;
  S.token = r.token; guardarLocal('cobros_token', r.token);
  const d = await api('obtenerInicio', S.token);
  if (d) { S.datos = d; S.usuario = d.usuario; guardarDatosLocal(d); ir('inicio'); sincronizar(); }
}
function salirLocal() { S.token = null; S.datos = null; guardarLocal('cobros_token', null); guardarLocal(DATOS_LOCAL, null); ir('login'); }
function salir() { google.script.run.cerrarSesion(S.token); salirLocal(); }

async function refrescar(silencioso) {
  if (silencioso) {
    google.script.run.withSuccessHandler(d => { S.datos = d; guardarDatosLocal(d); if (S.vista === 'inicio' || S.vista === 'alumnos') pintar(); })
      .withFailureHandler(() => {}).obtenerInicio(S.token);
    return;
  }
  const d = await api('obtenerInicio', S.token);
  if (d) { S.datos = d; guardarDatosLocal(d); pintar(); }
}

function actualizarTotal() {

  $('#total').textContent = dinero(m + c);
  $('#desglose').innerHTML = k.mant && k.cons
    ? `<div class="renglon"><span>Mantenimiento</span><span>${dinero(m)}</span></div><div class="renglon"><span>Construcción</span><span>${dinero(c)}</span></div>` : '';
}

async function guardarCobro() {
  const k = S.cobro, conceptos = [];
  if (k.mant && Number(k.montoM) > 0) conceptos.push({ concepto: 'Mantenimiento', periodo: k.periodoM, monto: Number(k.montoM) });
  if (k.cons && Number(k.montoC) > 0) conceptos.push({ concepto: 'Construcción', periodo: k.periodoC, monto: Number(k.montoC) });
  if (!k.mant && !k.cons) return aviso('Marque Mantenimiento o Construcción', true);
  if (!conceptos.length) return aviso('Escriba la cantidad que entrega', true);
  const digital = k.entrega !== 'impreso', impreso = k.entrega !== 'digital';
  const correo = digital ? String(k.correo || '').trim() : '';
  if (digital && !correoValido(correo)) {
    const i = $('#correoCobro'); if (i && i.focus) i.focus();
    return aviso('Escriba el correo del padre o tutor (o elija "Impreso")', true);
  }
  const total = conceptos.reduce((s, c) => s + c.monto, 0);
  if (!confirm(`¿Registrar cobro de ${dinero(total)} en efectivo a ${k.alumno.nombre}?` + (correo ? `\nSe enviará el comprobante a ${correo}` : ''))) return;

  const datos = { id: k.alumno.id, conceptos, observaciones: k.obs,
    correo, guardarCorreo: !!(correo && k.guardarCorreo && !k.alumno.correo) };
  if (!navigator.onLine) return guardarSinConexion(datos, k, impreso);
  const r = await api('registrarPago', S.token, datos);
  if (!r && S.ultimoErrorRed) return guardarSinConexion(datos, k, impreso);
  if (!r) return;
  S.recibo = r.recibo;
  S.pdf = r.pdf && !r.pdf.error ? r.pdf : null;
  S.envio = r.correo || (r.pdf && r.pdf.error ? { error: r.pdf.error } : null);
  S.ticket = null;
  if (correo && r.correo && r.correo.enviado && k.guardarCorreo) {
    const al = S.datos.alumnos.find(x => x.id === k.alumno.id);
    if (al) al.correo = correo;
  }
  S.cobro = null;
  ir('recibo');
  if (S.envio && S.envio.enviado) aviso('Comprobante enviado a ' + S.envio.enviado);
  else if (S.envio && S.envio.error) aviso(S.envio.error, true);
  refrescar(true);
  if (impreso) imprimirTicket();
}

function vConsulta() {

const pareceFolio = t => /^\s*r?-?\s*\d{1,6}\s*$/i.test(t);
const normalizarFolio = t => 'R-' + ('00000' + String(t).replace(/\D/g, '')).slice(-5);

function pintarConsulta() {
  const cont = $('#resConsulta'); if (!cont) return;
  const q = S.con.texto.trim().toLowerCase();
  if (!q) {
    const deudores = S.datos.alumnos.filter(a => !a.mant.ok || !a.cons.ok).length;
    cont.innerHTML = `<div class="tarjeta" style="padding:18px;display:flex;flex-direction:column;gap:8px">

      <span class="sub">Semestre ${esc(S.datos.config.periodoActual)} · ${deudores} de ${S.datos.alumnos.length} alumnos con adeudo.</span></div>`;
    return;

  let html = '';
  if (pareceFolio(q)) {
    const f = normalizarFolio(q);
    html += S.con.folio && S.con.folio.folio === f ? tarjetaFolio(S.con.folio)
      : `<button class="btn primario grande" onclick="buscarFolio()">${I.buscar()} Buscar el folio ${esc(f)}</button>`;
  }
  const lista = S.datos.alumnos.filter(a => a.nombre.toLowerCase().includes(q) || a.grupo.toLowerCase().replace(/[^0-9a-z]/g, '') === q.replace(/[^0-9a-z]/g, '')).slice(0, 40);

/* =================================================================
 * 8. MODO SIN CONEXIÓN
 *  Si se cae el internet con la app abierta, el cobro se guarda en este
 *  equipo (folio provisional P-XXXX), el ticket se imprime desde el
 *  navegador y todo se envía solo a la hoja cuando vuelve la conexión.
 * ================================================================= */
const COLA = 'cobros_pendientes_teba';
function leerCola() { try { return JSON.parse(localStorage.getItem(COLA) || '[]'); } catch (e) { return S.colaMemoria || []; } }
function guardarCola(c) { S.colaMemoria = c; try { localStorage.setItem(COLA, JSON.stringify(c)); } catch (e) {} }
function esErrorRed(m) { return !navigator.onLine || /network|red |de red|conexi|failed to fetch|timeout|tiempo de espera|unreachable|NetworkError/i.test(String(m || '')); }

function barraConexion() {
  const n = leerCola().length;
  if (!navigator.onLine) return `<div class="conexion fuera">${I.alerta(18)}<span style="flex:1;min-width:0">Sin internet · los cobros se guardan en este equipo${n ? ' (' + n + ' pendiente' + (n > 1 ? 's' : '') + ')' : ''}. Se enviarán solos al volver la señal.</span></div>`;
  if (n) return `<div class="conexion pend">${I.recargar(18)}<span style="flex:1;min-width:0">${n} cobro${n > 1 ? 's' : ''} sin conexión por enviar${S.sincronizando ? ' · enviando…' : ''}</span>
    ${S.sincronizando ? '' : '<button onclick="sincronizar(true)">Enviar ahora</button>'}</div>`;
  return '';
}

function guardarSinConexion(datos, k, impreso) {
  const c = S.datos.config, a = k.alumno;
  const prov = 'P-' + Date.now().toString(36).toUpperCase().slice(-6);
  const ahora = new Date();
  const item = { provisional: prov, fecha: ahora.toISOString(), datos, usuario: S.usuario.nombre, alumno: { id: a.id, nombre: a.nombre, grupo: a.grupo } };
  const cola = leerCola(); cola.push(item); guardarCola(cola);

  // Actualiza en pantalla el estado del alumno (para que ya no aparezca como deudor)
  const al = S.datos.alumnos.find(x => x.id === a.id);
  if (al) {
    datos.conceptos.forEach(cn => {
      if (cn.periodo !== c.periodoActual) return;
      const e = cn.concepto === 'Mantenimiento' ? al.mant : al.cons;
      e.pagado += cn.monto; e.debe = Math.max(0, e.cuota - e.pagado); e.ok = e.cuota > 0 ? e.pagado >= e.cuota : e.pagado > 0;
    });
    al.adeudo = al.mant.debe + al.cons.debe;
    S.datos.resumen.conAdeudo = S.datos.alumnos.filter(x => !x.mant.ok || !x.cons.ok).length;
  }
  const total = datos.conceptos.reduce((s, x) => s + x.monto, 0);
  S.datos.recientes.unshift({ folio: prov, alumno: a.nombre, grupo: a.grupo, conceptos: datos.conceptos.map(x => x.concepto), total, fecha: '' });
  S.recibo = { folio: prov, provisional: true, fecha: fechaCorta(ahora), alumno: a.nombre, grupo: a.grupo, id: a.id,
    conceptos: datos.conceptos, total, cobro: S.usuario.nombre, escuela: c.escuela, cct: c.cct, correo: datos.correo };
  S.pdf = null; S.envio = null; S.ticket = null; S.cobro = null;
  ir('recibo');
  aviso('Sin internet: cobro guardado en este equipo con folio provisional ' + prov);
  if (impreso) imprimirTicketLocal(S.recibo);
}

function fechaCorta(d) {
  const p = n => ('0' + n).slice(-2);
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// Envía a la hoja los cobros guardados sin conexión, uno por uno y en orden
async function sincronizar(manual) {
  if (S.sincronizando || !S.token) return;
  let cola = leerCola();
  if (!cola.length) return;
  if (!navigator.onLine) { if (manual) aviso('Todavía no hay internet.', true); return; }
  S.sincronizando = true; pintarBarraConexion();
  let enviados = 0;
  for (const item of cola.slice()) {
    const res = await new Promise(ok => {
      google.script.run.withSuccessHandler(r => ok({ r })).withFailureHandler(e => ok({ e: (e && e.message) || String(e) }))
        .registrarPago(S.token, Object.assign({}, item.datos, { offline: { provisional: item.provisional, fecha: item.fecha } }));
    });
    if (res.e) {
      if (esErrorRed(res.e)) break;                                // sigue sin internet: se reintenta después
      if (res.e.indexOf('SESION') >= 0) { S.sincronizando = false; salirLocal(); aviso('Ingrese su PIN para terminar de enviar los cobros pendientes.', true); return; }
      item.error = res.e;                                          // error de datos: se queda para revisarlo
      guardarCola(cola); continue;
    }
    cola = leerCola().filter(x => x.provisional !== item.provisional); guardarCola(cola);
    enviados++;
    if (S.recibo && S.recibo.folio === item.provisional) {        // si está viendo ese recibo, se cambia por el definitivo
      S.recibo = res.r.recibo; S.pdf = res.r.pdf && !res.r.pdf.error ? res.r.pdf : null; S.envio = res.r.correo;
    }
  }
  S.sincronizando = false;
  if (enviados) { aviso(enviados + ' cobro' + (enviados > 1 ? 's' : '') + ' sin conexión enviado' + (enviados > 1 ? 's' : '') + ' a la hoja ✓'); refrescar(true); }
  if (['inicio', 'recibo', 'consulta', 'alumnos'].includes(S.vista)) pintar(); else pintarBarraConexion();
}
function pintarBarraConexion() {
  const b = document.querySelector('.conexion'); const nueva = barraConexion();
  if (b) b.outerHTML = nueva || '<div class="conexion" style="display:none"></div>';
  else if (nueva && S.vista !== 'login') pintar();
}
window.addEventListener('online', () => { pintarBarraConexion(); sincronizar(); });
window.addEventListener('offline', () => pintarBarraConexion());
setInterval(() => { if (leerCola().length) sincronizar(); }, 30000);

// Cantidad con letra (igual que en Código.gs, para poder usarla sin internet)
function montoLetras_(n) {
  n = Math.round((Number(n) || 0) * 100) / 100;
  const entero = Math.floor(n);
  const cent = Math.round((n - entero) * 100);
  const U = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE',
    'CATORCE', 'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE', 'VEINTE', 'VEINTIÚN', 'VEINTIDÓS', 'VEINTITRÉS',
    'VEINTICUATRO', 'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
  function menorMil(x) {
    if (x === 0) return '';
    if (x === 100) return 'CIEN';
    const c = Math.floor(x / 100), r = x % 100;
    let t = C[c];
    if (r) t += (t ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : ''));
    return t;
  }
  function letras(x) {
    if (x === 0) return 'CERO';
    const mill = Math.floor(x / 1000000), miles = Math.floor((x % 1000000) / 1000), resto = x % 1000;
    const p = [];
    if (mill) p.push(mill === 1 ? 'UN MILLÓN' : menorMil(mill) + ' MILLONES');
    if (miles) p.push(miles === 1 ? 'MIL' : menorMil(miles) + ' MIL');
    if (resto) p.push(menorMil(resto));
    return p.join(' ');
  }
  const t = letras(entero);
  const de = (entero >= 1000000 && entero % 1000000 === 0) ? ' DE' : '';
  return t + de + (entero === 1 ? ' PESO ' : ' PESOS ') + ('0' + cent).slice(-2) + '/100 M.N.';
}

    </section>

  </div>
  <div class="pie"><button class="btn primario grande" onclick="guardarConfig()">Guardar cambios</button></div>`;
}

async function guardarConfig() {
  const v = id => $('#' + id).value;
  const pa = v('cPA').trim(), ps = v('cPS').trim();
  if (!pa || !ps) return aviso('Escriba el nombre de los dos semestres', true);
  if (pa === ps) return aviso('Los dos semestres deben llamarse distinto', true);
  const cfg = await api('guardarConfig', S.token, {
    CICLO: v('cCiclo'), PERIODO_ACTUAL: pa, PERIODO_SIGUIENTE: ps,
    MONTO_MANTENIMIENTO: v('cMM'), MONTO_CONSTRUCCION: v('cMC'),
    LIMITE_ACTUAL: v('cLA'), LIMITE_SIGUIENTE: v('cLS')
  });
  if (!cfg) return;
  aviso('Cambios guardados');
  await refrescar();
  ir('inicio');
}

<script>
window.__MODULO_CAL_LISTO = true;

const NIVELES = ['Buena', 'Regular', 'Mala'];

S.cal = { grupo: null, parcial: 1, datos: null, alumno: null, busqueda: '', avance: null };

const semestreDe = g => (String(g).match(/\d+/) || ['1'])[0];

const VISTAS_CAL = { captura: () => vCaptura(), capturaAlumno: () => vCapturaAlumno(), boletas: () => vBoletas() };
const pintarCobros = pintar;
pintar = function () {

  const angosto = S.vista === 'capturaAlumno' || S.vista === 'boletas' ? ' angosto' : '';

  return menuCobros().replace(/(Movimientos<\/button>)/, '$1' + extra);
};

const inicioCobros = vInicio;
vInicio = function () {
  const bloque = `
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">

};
function htmlAvance() {

}
function cargarAvance() {

    if (primera) S.cal.parcial = av.parcial;

    if (caja) caja.innerHTML = htmlAvance();
  }).withFailureHandler(() => {}).obtenerAvanceCal(S.token);
}

function gruposCal() { return S.cal.grupos ? S.cal.grupos.map(x => x.clave) : [...new Set(S.datos.alumnos.map(a => a.grupo))]; }
async function cargarGruposCal() {
  const r = await api('obtenerGruposCal', S.token);

  return r;
}
async function cargarGrupo(grupo) {
  if (!S.cal.grupos) await cargarGruposCal();
  if (!grupo) grupo = S.cal.grupo;
  if (!grupo) { const g = gruposCal(); grupo = g[0]; }
  if (!grupo) { aviso('Aún no hay alumnos registrados.', true); return null; }
  const d = await api('obtenerGrupoCal', S.token, grupo);
  if (d) { S.cal.datos = d; S.cal.grupo = grupo; S.cal.busqueda = ''; }
  return d;
}
async function cambiarGrupo(g) { if (await cargarGrupo(g)) pintar(); }

function avanceAlumno(a) {
  const p = S.cal.parcial - 1;
  const listas = a.notas.filter(n => !vacia(n[p])).length;
  return { listas, total: a.notas.length, conducta: !!a.conducta[p] };
}

async function abrirCaptura() { S.cal.grupos = null; if (await cargarGrupo()) ir('captura'); }

function vCaptura() {
  const c = S.cal;
  return `${barra('Capturar calificaciones', "ir('inicio')")}
    <div class="barra-filtros" style="background:var(--marino);padding:0 16px 14px;display:flex;flex-direction:column;gap:12px">
      <label class="buscador">${I.buscar()}<span class="oculto">Buscar alumno</span>
        <input type="search" placeholder="Buscar alumno por nombre" value="${esc(c.busqueda)}" oninput="S.cal.busqueda=this.value;pintarListaCal()"></label>
      <div class="chips">${gruposCal().map(g => `<button class="chip ${c.grupo === g ? 'activo' : ''}" onclick="cambiarGrupo('${esc(g)}')">${esc(g)}</button>`).join('')}</div>
    </div>
    <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:10px" id="conteo">
      <div class="segmento" role="group" aria-label="Parcial">
        ${[1, 2, 3].map(p => `<button class="${c.parcial === p ? 'activo' : ''}" onclick="S.cal.parcial=${p};pintar()">${PERIODOS[p - 1]}</button>`).join('')}
      </div>
      <p class="sub" style="font-weight:600" id="conteo-cal"></p>
    </div>
    <div class="envoltura-cal"><div id="lista-cal"></div></div>`;
}
function pintarListaCal() {
  const q = S.cal.busqueda.trim().toLowerCase();
  const al = S.cal.datos.alumnos.filter(a => !q || a.nombre.toLowerCase().includes(q));
  const listos = S.cal.datos.alumnos.filter(a => { const v = avanceAlumno(a); return v.listas === v.total && v.conducta; }).length;
  $('#conteo-cal').textContent = `${S.cal.grupo} · ${PERIODOS[S.cal.parcial - 1]} · ${listos} de ${S.cal.datos.alumnos.length} alumnos completos · ${S.cal.datos.materias.length} materias por alumno`;
  $('#lista-cal').innerHTML = al.map(a => {
    const v = avanceAlumno(a);
    const estado = v.listas === v.total && v.conducta ? '<span class="estado ok">Completo ✓</span>'
      : v.listas === 0 && !v.conducta ? '<span class="estado debe">Sin capturar</span>'
      : `<span class="estado debe">${v.listas} de ${v.total} materias${v.conducta ? '' : ' · falta conducta'}</span>`;
    return `<button class="fila tarjeta" style="border:1px solid var(--borde)" onclick="abrirAlumnoCal('${a.id}')">
      <div class="avatar">${esc(iniciales(a.nombre))}</div>
      <div class="txt"><span class="nombre">${esc(a.nombre)}</span><div class="estados">${estado}</div></div>${I.sig()}</button>`;
  }).join('') || '<div class="vacio">No hay alumnos con ese nombre.</div>';
}

function abrirAlumnoCal(id) { S.cal.alumno = id; ir('capturaAlumno'); }
const alumnoCal = () => S.cal.datos.alumnos.find(a => a.id === S.cal.alumno);

function vCapturaAlumno() {
  const a = alumnoCal(), d = S.cal.datos, p = S.cal.parcial - 1;
  const filas = d.materias.map((m, i) => {
    const v = a.notas[i][p], ac = d.acredita[i];
    const ver = x => vacia(x) ? '—' : x === 'NA' ? 'N/A' : x;
    const roja = x => x === 'NA' || (!vacia(x) && x !== 'A' && x <= 5);
    const previas = a.notas[i].slice(0, p).map((x, k) => `${CORTO[k]}: <b class="${roja(x) ? 'roja-txt' : ''}">${ver(x)}</b>`).join(' · ');
    const campo = ac
      ? `<div class="acred ${vacia(v) ? 'vacia' : ''}" role="group" aria-label="${esc(m)}">
           <button class="${v === 'A' ? 'si' : ''}" onclick="ponerAcred(${i}, 'A')">A</button>
           <button class="${v === 'NA' ? 'no' : ''}" onclick="ponerAcred(${i}, 'NA')">N/A</button></div>`
      : `<label class="oculto" for="m-${i}">Calificación de ${esc(m)}</label>
         <input id="m-${i}" class="nota ${vacia(v) ? 'vacia' : v <= 5 ? 'roja' : ''}" type="number" inputmode="numeric" min="1" max="10" step="1"
             value="${vacia(v) ? '' : v}" placeholder="—" oninput="cambiarNota(${i}, this)">`;
    return `<div class="fila">
      <div class="txt"><span class="nombre">${esc(m)}</span><span class="sub">${ac ? 'Acreditación (A / N/A)' : ''}${ac && previas ? ' · ' : ''}${previas}</span></div>
      ${campo}
    </div>`;
  }).join('');
  const con = a.conducta[p];
  return `${barra('Capturar calificaciones', "ir('captura')")}
    <div class="contenido">
      <div class="tarjeta">
        <div class="ficha-cab"><div class="avatar">${esc(iniciales(a.nombre))}</div>
          <div class="txt" style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
            <span style="font-size:19px;font-weight:800">${esc(a.nombre)}</span>
            <span class="sub">Grupo ${esc(a.grupo)} · Semestre ${esc(semestreDe(a.grupo))} · CURP ${esc(a.curp)}</span></div></div>
        <div style="padding:0 16px 16px"><div class="segmento" role="group" aria-label="Parcial">
          ${[1, 2, 3].map(n => `<button class="${S.cal.parcial === n ? 'activo' : ''}" onclick="S.cal.parcial=${n};pintar()">${PERIODOS[n - 1]}</button>`).join('')}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="renglon"><h2 style="font-size:17px;font-weight:800">Calificaciones · ${PERIODOS[S.cal.parcial - 1]}</h2>
          <span class="sub" style="font-weight:600">${d.materias.length} materias de ${esc(a.grupo)}</span></div>
        <p class="sub">Escala de 1 a 10. De 1 a 5 se marca en rojo. Los promedios de la boleta se calculan solos.</p>
        <div class="tarjeta">${filas}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h2 style="font-size:17px;font-weight:800">Conducta observada · ${PERIODOS[S.cal.parcial - 1]}</h2>
        <div class="cuatro" role="group" aria-label="Conducta general">
          ${NIVELES.map(n => `<button class="opcion ${con === n ? (n === 'Mala' ? 'activo-rojo' : 'activo') : ''}" onclick="alumnoCal().conducta[${p}]='${n}';pintar()"><b>${n}</b></button>`).join('')}
        </div>

    <div class="pie">
      <div class="renglon"><span class="sub" style="font-weight:700" id="cal-cuenta">${textoCuenta()}</span>
        <span class="sub" style="font-weight:700" id="cal-prom">${textoPromedio()}</span></div>

        <button class="btn borde" onclick="guardarAlumno(false)">Guardar</button>
        <button class="btn primario" onclick="guardarAlumno(true)">Guardar y siguiente ${I.sig(18).replace('#5A6475', '#fff')}</button>
      </div>
    </div>`;
}
function cambiarNota(i, el) {
  let t = String(el.value || '').replace(/[^0-9]/g, '');
  while (t.length && (Number(t) > 10 || Number(t) < 1)) t = t.slice(0, -1);
  if (t !== String(el.value || '')) { el.value = t; aviso('Solo se aceptan calificaciones enteras del 1 al 10', true); }
  const v = t === '' ? '' : Number(t);
  alumnoCal().notas[i][S.cal.parcial - 1] = v;
  el.className = 'nota ' + (v === '' ? 'vacia' : v <= 5 ? 'roja' : '');
  $('#cal-cuenta').textContent = textoCuenta();
  $('#cal-prom').innerHTML = textoPromedio();
}
function ponerAcred(i, val) {
  const n = alumnoCal().notas[i], p = S.cal.parcial - 1;
  n[p] = n[p] === val ? '' : val;
  pintar();
}
function textoCuenta() { const v = avanceAlumno(alumnoCal()); return `${v.listas} de ${v.total} materias`; }
function textoPromedio() {
  const p = S.cal.parcial - 1, ac = S.cal.datos.acredita;
  const v = alumnoCal().notas.map((n, i) => ac[i] ? '' : n[p]).filter(x => !vacia(x)).map(Number);
  const rotulo = ['Promedio del Parcial I', 'Promedio del Parcial II', 'Promedio de la evaluación final'][p];
  if (!v.length) return rotulo + ': —';
  const m = v.reduce((s, x) => s + x, 0) / v.length;
  return `${rotulo}: <span class="${m < 6 ? 'roja-txt' : ''}" style="font-weight:800;${m < 6 ? '' : 'color:var(--tinta)'}">${m.toFixed(1)}</span>`;
}
async function guardarAlumno(siguiente) {
  const a = alumnoCal();
  const r = await api('guardarCalificaciones', S.token, { id: a.id, parcial: S.cal.parcial, notas: a.notas.map(n => n[S.cal.parcial - 1]), conducta: a.conducta[S.cal.parcial - 1] || '' });
  if (!r) return;
  aviso('Guardado: ' + a.nombre + ' ✓');
  S.cal.avance = null;
  const al = S.cal.datos.alumnos, i = al.findIndex(x => x.id === a.id);
  if (siguiente && i < al.length - 1) abrirAlumnoCal(al[i + 1].id); else ir('captura');
}

async function abrirBoletas() { S.cal.grupos = null; if (await cargarGrupo()) ir('boletas'); }
function vBoletas() {
  const c = S.cal, d = c.datos;
  const lista = d.alumnos.map(a => {
    const r = resumenAlumno(a), v = avanceAlumno(a);
    const falta = v.total - v.listas;
    return `<button class="fila" onclick="verBoleta('${a.id}')">
      <div class="avatar">${esc(iniciales(a.nombre))}</div>
      <div class="txt"><span class="nombre">${esc(a.nombre)}</span>
        <div class="estados">${falta || !v.conducta ? `<span class="estado debe">${PERIODOS[c.parcial - 1]}: ${falta ? 'faltan ' + falta + ' materia' + (falta > 1 ? 's' : '') : ''}${falta && !v.conducta ? ' y conducta' : !v.conducta ? 'falta conducta' : ''}</span>` : '<span class="estado ok">Al día</span>'}
          ${r.reprobadas ? `<span class="estado rojo">${r.reprobadas} no aprobada${r.reprobadas > 1 ? 's' : ''}</span>` : ''}</div></div>
      <span class="prom ${r.general !== null && r.general < 6 ? 'roja-txt' : ''}">${r.general === null ? '—' : r.general.toFixed(1)}</span>${I.sig()}</button>`;
  }).join('');
  return `${barra('Boletas', "ir('inicio')")}
    <div class="barra-filtros" style="background:var(--marino);padding:0 16px 14px;display:flex;flex-direction:column;gap:12px">
      <div class="chips">${gruposCal().map(g => `<button class="chip ${c.grupo === g ? 'activo' : ''}" onclick="cambiarGrupo('${esc(g)}')">${esc(g)}</button>`).join('')}</div>
    </div>
    <div class="contenido">
      <div class="dos">
        <button class="acceso-grande" onclick="imprimirGrupo()">${I.impresora(26)} Imprimir boletas del ${esc(c.grupo)}</button>
        <button class="acceso-grande" style="background:#1E6B45" onclick="pedirConcentrado()">${I.bajar(26)} Concentrado en Excel</button>
      </div>
      <p class="sub">La boleta sale en el formato oficial y se llena con lo capturado: Parcial I, Parcial II y Evaluación final.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="renglon"><h2 style="font-size:17px;font-weight:800">Alumnos del ${esc(c.grupo)}</h2><span class="sub" style="font-weight:600">Promedio</span></div>
        <div class="tarjeta">${lista}</div>
      </div>
    </div>`;
}
function calcMateria(n) {
  const [I, II, EF] = n.map(x => vacia(x) ? '' : Number(x));
  const pp = I !== '' && II !== '' ? (I + II) / 2 : '';
  let pf = '';
  if (pp !== '' && EF !== '') { const m = (pp + EF) / 2; pf = m < 6 ? 5 : Math.round(m); }
  const capt = [I, II].filter(x => x !== '');
  const actual = pf !== '' ? pf : pp !== '' ? pp : capt.length ? capt[0] : '';
  return { pp, pf, actual };
}
function resumenAlumno(a) {
  const ac = S.cal.datos.acredita;
  let suma = 0, n = 0, reprobadas = 0;
  a.notas.forEach((nt, i) => {
    if (ac[i]) { if (nt.includes('NA')) reprobadas++; return; }

let excelJSCargado = null;
function cargarExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  if (excelJSCargado) return excelJSCargado;
  const fuentes = ['https:\/\/cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
                   'https:\/\/cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'];
  excelJSCargado = new Promise((ok, mal) => {
    const intentar = i => {
      if (i >= fuentes.length) { excelJSCargado = null; return mal(new Error('No se pudo cargar el generador de Excel. Revise su conexión.')); }
      const s = document.createElement('script'); s.src = fuentes[i];
      s.onload = () => ok(); s.onerror = () => intentar(i + 1);
      document.head.appendChild(s);
    };
    intentar(0);
  });
  return excelJSCargado;
}

        <p class="sub">Cada grupo lleva las materias de su semestre (pestaña Materias). Los archivos se descargan y además se guardan en Drive, en la carpeta <b>Respaldos ${esc(S.datos.config.ciclo)}</b>.</p>
        <div class="dos">
          <button class="acceso-grande" style="background:#1E6B45" onclick="respaldoLibroCompleto()">${I.bajar(26)} Un Excel con todos (una hoja por grupo)</button>
          <button class="acceso-grande" onclick="respaldoTodo()">${I.carpeta(26)} Generar todo: concentrado y boletas de cada grupo</button>
        </div>
        <p class="sub" id="progreso-respaldo"></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h2 style="font-size:17px;font-weight:800">Por grupo</h2>
        <div class="tarjeta">${filas || '<div class="vacio">Aún no hay alumnos registrados.</div>'}</div>
      </div>
    </div>`;
}

const cicloCorto = () => String(S.datos.config.ciclo || '').replace(/^\d\d(\d\d)\D+\d\d(\d\d)$/, '$1-$2');
const letraG = g => String(g).replace(/^\s*\d+\s*[°º.]?\s{0,}/, '');
function aBase64(buf) { let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(bin); }
function marcar(g, campo, valor) { S.cal.respaldos = S.cal.respaldos || {}; (S.cal.respaldos[g] = S.cal.respaldos[g] || {})[campo] = valor; }
function progreso(t) { const p = document.getElementById('progreso-respaldo'); if (p) p.textContent = t; }

function datosDeGrupo(g) {
  return new Promise(ok => google.script.run.withSuccessHandler(d => ok({ d }))
    .withFailureHandler(e => ok({ e: (e && e.message) || String(e) })).obtenerGrupoCal(S.token, g));
}
function llamar(fn, ...args) {
  return new Promise(ok => google.script.run.withSuccessHandler(r => ok({ r }))
    .withFailureHandler(e => ok({ e: (e && e.message) || String(e) }))[fn](...args));
}
function infoConcentrado(d) {
  const cfg = S.datos.config;
  return { escuela: cfg.escuela, cct: cfg.cct, periodo: cfg.ciclo, coordinador: d.coordinador, maestro: leerLocal('maestro_' + d.grupo) || '' };
}

async function respaldoConcentrado(g, descargar) {
  if (descargar) cargando(true);
  try {
    await cargarExcelJS();
    const x = await datosDeGrupo(g);
    if (x.e) throw new Error(x.e);
    const wb = crearConcentrado(window.ExcelJS, x.d, infoConcentrado(x.d));
    const nombre = `${x.d.semestre}_${letraG(g)}_${cicloCorto()}.xlsx`;
    const r = await llamar('guardarRespaldo', S.token, g, aBase64(new Uint8Array(await wb.xlsx.writeBuffer())), nombre);
    if (r.e) throw new Error(r.e);
    marcar(g, 'xlsx', r.r); marcar(g, 'error', '');
    if (descargar) { cargando(false); window.open(r.r.descarga, '_blank', 'noopener'); aviso('Concentrado del ' + g + ' listo ✓'); pintar(); }
    return true;
  } catch (e) {
    marcar(g, 'error', (e && e.message) || String(e));
    if (descargar) { cargando(false); aviso('Grupo ' + g + ': ' + ((e && e.message) || e), true); pintar(); }
    return false;
  }
}
async function respaldoBoletas(g, sinAbrir) {
  if (!sinAbrir) cargando(true);
  const r = await llamar('generarBoletasGrupoPDF', S.token, g);
  if (!sinAbrir) cargando(false);
  if (r.e) { marcar(g, 'error', r.e); if (!sinAbrir) { aviso('Grupo ' + g + ': ' + r.e, true); pintar(); } return false; }
  marcar(g, 'pdf', r.r);
  if (!sinAbrir) { window.open(r.r.url, '_blank', 'noopener'); aviso('Boletas del ' + g + ' guardadas ✓'); pintar(); }
  return true;
}
async function respaldoTodo() {
  const grupos = gruposCal().sort((x, y) => x.localeCompare(y, 'es'));
  let bien = 0;
  for (let i = 0; i < grupos.length; i++) {
    progreso(`Generando ${i + 1} de ${grupos.length}: grupo ${grupos[i]}…`);
    const a = await respaldoConcentrado(grupos[i], false);
    progreso(`Generando ${i + 1} de ${grupos.length}: boletas del ${grupos[i]}…`);
    const b = await respaldoBoletas(grupos[i], true);
    if (a && b) bien++;
  }
  pintar();
  progreso(`Listo: ${bien} de ${grupos.length} grupos respaldados. Use los enlaces de cada grupo para abrirlos.`);
  aviso(`Respaldo terminado: ${bien} de ${grupos.length} grupos ✓`, bien < grupos.length);
}
async function respaldoLibroCompleto() {
  const grupos = gruposCal().sort((x, y) => x.localeCompare(y, 'es'));
  try {
    await cargarExcelJS();
    const wb = new window.ExcelJS.Workbook();
    const faltan = [];
    for (let i = 0; i < grupos.length; i++) {
      progreso(`Agregando ${i + 1} de ${grupos.length}: grupo ${grupos[i]}…`);
      const x = await datosDeGrupo(grupos[i]);
      if (x.e) { faltan.push(grupos[i]); marcar(grupos[i], 'error', x.e); continue; }
      crearConcentrado(window.ExcelJS, x.d, infoConcentrado(x.d), wb);
    }
    if (!wb.worksheets.length) throw new Error('Ningún grupo tiene materias registradas.');
    const nombre = `Concentrado_todos_los_grupos_${cicloCorto()}.xlsx`;
    progreso('Guardando en Drive…');
    const r = await llamar('guardarRespaldo', S.token, 'Todos', aBase64(new Uint8Array(await wb.xlsx.writeBuffer())), nombre);
    if (r.e) throw new Error(r.e);
    window.open(r.r.descarga, '_blank', 'noopener');
    pintar();
    progreso(`Listo: ${wb.worksheets.length} grupos en un solo archivo${faltan.length ? ' (sin materias: ' + faltan.join(', ') + ')' : ''}.`);
  } catch (e) { progreso(''); aviso((e && e.message) || String(e), true); }
}
</script>

<script>
(function () {
  function esMonto(el) { return el && el.tagName === 'INPUT' && (el.closest('.monto') || el.id === 'cMM' || el.id === 'cMC'); }
  function esNota(el) { return el && el.tagName === 'INPUT' && el.classList.contains('nota'); }
  document.addEventListener('keydown', function (e) {
    const el = e.target;
    if (!(esMonto(el) || esNota(el))) return;
    if (['.', ',', 'e', 'E', '-', '+'].indexOf(e.key) >= 0) {
      e.preventDefault();
      if (esMonto(el) && (e.key === '.' || e.key === ',')) {
        el.dataset.centavos = '1';
        aviso('En cobros solo se aceptan pesos enteros, sin centavos', true);
      }
      return;
    }
    if (esMonto(el) && el.dataset.centavos === '1') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); return; }
      if (e.key.length > 1) el.dataset.centavos = '';
    }
  }, true);
  document.addEventListener('focusin', function (e) { if (esMonto(e.target)) e.target.dataset.centavos = ''; }, true);
  document.addEventListener('input', function (e) {
    if (!esMonto(e.target)) return;
    const v = String(e.target.value || ''), limpio = v.split(/[.,]/)[0].replace(/[^0-9]/g, '');
    if (limpio !== v) e.target.value = limpio;
  }, true);
  function ajustarMontos() {
    document.querySelectorAll('.monto input, #cMM, #cMC').forEach(function (el) {
      el.step = '1'; el.min = '0'; el.inputMode = 'numeric';
      if (el.placeholder === '0.00') el.placeholder = '0';
      if (el.value && el.value.indexOf('.') >= 0) el.value = String(Math.round(Number(el.value)));
    });
  }
  const pintarAntes = pintar;
  pintar = function () {
    if (S.vista === 'cobro' && S.cobro) {
      ['montoM', 'montoC'].forEach(function (k) { if (S.cobro[k] !== '' && S.cobro[k] != null) S.cobro[k] = Math.round(Number(S.cobro[k]) || 0); });
    }
    pintarAntes();
    ajustarMontos();
  };
  const guardarCobroAntes = guardarCobro;
  guardarCobro = function () {
    const k = S.cobro || {};
    const malo = [k.mant ? k.montoM : '', k.cons ? k.montoC : ''].some(function (m) { return m !== '' && m != null && !Number.isInteger(Number(m)); });
    if (malo) return aviso('Escriba la cantidad en pesos enteros, sin centavos', true);
    return guardarCobroAntes();
  };
  const guardarConfigAntes = guardarConfig;
  guardarConfig = function () {
    const malo = ['cMM', 'cMC'].some(function (id) { const el = document.getElementById(id); return el && el.value !== '' && !Number.isInteger(Number(el.value)); });
    if (malo) return aviso('Las cuotas deben ser en pesos enteros, sin centavos', true);
    return guardarConfigAntes();
  };
})();
</script>

<script>
document.body.classList.add('tema-guinda');
(function () {
  const quitarAcentos = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esAdmin = () => S.usuario && S.usuario.rol === 'admin';
  const NOMBRE_AREA = { QB: 'Químico-Biológico', EA: 'Económico-Administrativo', HCS: 'Humanidades y C. Sociales', FM: 'Físico-Matemático' };

  function temaActual() { return (S.datos && S.datos.config && S.datos.config.tema) || (S.publico && S.publico.tema) || 'guinda'; }
  function aplicarTema() {
    const t = temaActual();
    document.body.classList.toggle('tema-guinda', t !== 'azul');
    document.body.classList.toggle('tema-azul', t === 'azul');
  }
  window.aplicarTema = aplicarTema;

  VISTAS_CAL.capturaMateria = () => vCapturaMateria();
  VISTAS_CAL.tablero = () => vTablero();

  const pintarPrevio = pintar;
  pintar = function () {
    if (S.vista === 'inicio' && S.usuario && S.usuario.direccion && S.cal.arranque !== S.token) { S.cal.arranque = S.token; S.vista = 'tablero'; }
    if (S.vista !== 'capturaMateria' && S.cal.cola && Object.keys(S.cal.cola).length) enviarCola();
    aplicarTema();
    pintarPrevio();
    if (S.vista === 'tablero' && !S.cal.tablero) cargarTablero();
    if (S.vista === 'capturaMateria') despuesMateria();
  };

  const menuPrevio = menuLateral;
  menuLateral = function () {
    let h = menuPrevio();
    const act = S.vista === 'tablero' ? ' activo' : '';
    const extra = `<button class="menu buscar-g" onclick="abrirBuscador()">${I.buscar(20)} Buscar <kbd>Ctrl K</kbd></button>` +
      (esAdmin() ? `<button class="menu${act}" onclick="abrirTablero()">${I.reportes(20)} Tablero de dirección</button>` : '');
    h = h.replace(/<button class="menu[^"]*" onclick="ir\('inicio'\)">/, m => extra + m);
    if (S.vista === 'capturaMateria') h = h.replace('class="menu" onclick="abrirCaptura()"', 'class="menu activo" onclick="abrirCaptura()"');
    return h;
  };

  vLogin = function () {
    const p = S.publico || {};
    const teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Borrar', '0', 'Entrar'];
    return `<main class="login2">
      <section class="login2-izq">
        <div class="login2-esc">${logoHTML(72)}<div><b>${esc(p.escuela || 'Telebachillerato Catemaco')}</b><span>CCT ${esc(p.cct || '30ETH0228Z')} · Catemaco, Ver.</span></div></div>
      </section>
      <section class="login2-der">
        <form class="login2-form" onsubmit="entrar(event)">
          <div><h1>Bienvenida</h1><p class="sub" style="margin-top:6px;font-size:15px">Escriba su PIN para entrar</p></div>
          <label class="oculto" for="pin">PIN de acceso</label>
          <input id="pin" class="login2-pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus
                 oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <div class="teclado">${teclas.map(k => k === 'Entrar' ? `<button type="submit" class="entrar">Entrar</button>`
            : `<button type="button" class="${k === 'Borrar' ? 'chica' : ''}" onclick="teclaPin('${k}')">${k}</button>`).join('')}</div>
          <p class="sub" style="text-align:center;font-size:13px">Secretaría abre en Inicio · Dirección abre en el Tablero</p>
        </form>
      </section>
    </main>`;
  };
  window.teclaPin = function (k) {
    const el = document.getElementById('pin'); if (!el) return;
    el.value = k === 'Borrar' ? el.value.slice(0, -1) : el.value + k;
    el.focus();
  };

  const accion = (fn, ic, t, d, clase) => `<button class="accion ${clase || ''}" onclick="${fn}"><span class="ic">${ic}</span><span><b>${t}</b>${d ? `<small>${d}</small>` : ''}</span></button>`;
  const inicioPrevio = vInicio;
  vInicio = function () {
    const extra = '<div class="acciones2">' + accion('abrirCapturaMateria()', I.lista(22), 'Captura por materia', 'Todo el grupo, con teclado', 'verde') +
      (esAdmin() ? accion('abrirCierre()', I.llave(22), 'Cerrar parcial', 'Revisar, respaldar y bloquear', 'verde') : accion('abrirBuscador()', I.buscar(22), 'Buscar', 'Ctrl + K', 'verde')) + '</div>';
    return inicioPrevio().replace(/(onclick="abrirRespaldos\(\)"[\s\S]*?<\/button>\s*<\/div>)/, '$1' + extra);
  };

  const configPrevio = vConfig;
  vConfig = function () {
    const t = temaActual();
    const op = (v, nombre, c1, c2) => `<button class="opcion ${t === v ? 'activo' : ''}" onclick="elegirTema('${v}')" style="display:flex;gap:12px;align-items:center;justify-content:flex-start;padding:12px">
      <span style="width:44px;height:30px;border-radius:8px;background:linear-gradient(135deg,${c1} 60%,${c2} 60%);flex:none"></span><b>${nombre}</b></button>`;
    const sec = `<section class="tarjeta" style="padding:16px;display:flex;flex-direction:column;gap:14px">
      <h2 style="font-size:17px;font-weight:800">Color del sistema</h2>
      <div class="dos">${op('guinda', 'Guinda y dorado', '#7A1F3D', '#B38E5D')}${op('azul', 'Azul con guinda', '#13315C', '#7A1F3D')}</div>
      <span class="sub">Se aplica para todos los usuarios al volver a entrar.</span></section>`;
    return configPrevio().replace('<span class="sub">Los usuarios y PIN', sec + '<span class="sub">Los usuarios y PIN');
  };
  window.elegirTema = async function (t) {
    const r = await api('guardarTema', S.token, t);
    if (!r) return;
    S.datos.config.tema = r;
    aplicarTema(); pintar();
    aviso('Color del sistema actualizado ✓');
  };

  function avisoCierre(d, p) {
    if (!d || !d.cerrados || !d.cerrados[p]) return '';
    return `<div class="aviso-cierre">${I.llave(20)} El ${PERIODOS[p]} está cerrado. ${d.puedeCorregir ? 'Como dirección, puede corregir.' : 'Solo dirección puede corregir calificaciones.'}</div>`;
  }
  const modoCap = m => `<div class="modo-cap"><div class="conmutador" role="group" aria-label="Forma de captura">
      <button class="${m === 'alumno' ? 'activo' : ''}" onclick="ir('captura')">Por alumno</button>
      <button class="${m === 'materia' ? 'activo' : ''}" onclick="ir('capturaMateria')">Por materia</button></div></div>`;
  const capPrevio = vCaptura;
  vCaptura = function () {
    const marca = '<div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:10px" id="conteo">';
    return capPrevio().replace(marca, avisoCierre(S.cal.datos, S.cal.parcial - 1) + marca + modoCap('alumno'));
  };
  const capAlPrevio = vCapturaAlumno;
  vCapturaAlumno = function () {
    const d = S.cal.datos, p = S.cal.parcial - 1;
    let h = capAlPrevio().replace(/(<\/header>)/, '$1' + avisoCierre(d, p));
    if (d.cerrados && d.cerrados[p] && !d.puedeCorregir) h = h.replace(/onclick="guardarAlumno\(/g, 'disabled onclick="guardarAlumno(');
    return h;
  };

  window.abrirCapturaMateria = async function () { S.cal.grupos = null; if (await cargarGrupo()) ir('capturaMateria'); };
  window.cambiarGrupoMateria = async function (g) { await enviarCola(); if (await cargarGrupo(g)) pintar(); };
  window.cambiarMateria = async function (i) { await enviarCola(); S.cal.materia = Number(i); pintar(); };
  window.cambiarPeriodoMateria = async function (p) { await enviarCola(); S.cal.parcial = p; pintar(); };

  const verNota = v => vacia(v) ? '' : v === 'NA' ? 'N/A' : String(v);
  const esRoja = v => v === 'NA' || (!vacia(v) && v !== 'A' && Number(v) <= 5);
  function bloqueada() { const d = S.cal.datos, p = S.cal.parcial - 1; return !!(d.cerrados && d.cerrados[p] && !d.puedeCorregir); }

  function vCapturaMateria() {
    const c = S.cal, d = c.datos, p = c.parcial - 1;
    if (c.materia == null || c.materia >= d.materias.length) c.materia = 0;
    const i = c.materia, ac = d.acredita[i], bloq = bloqueada();
    c.orig = d.alumnos.map(a => a.notas[i][p]);
    const prev = [0, 1, 2].slice(0, p);
    const filas = d.alumnos.map((a, r) => {
      const n = a.notas[i], v = n[p];
      return `<tr id="fm-${r}">
        <td class="num">${r + 1}</td><td style="font-weight:600">${esc(a.nombre)}</td>
        ${prev.map(k => `<td class="previa ${esRoja(n[k]) ? 'roja-n' : ''}">${verNota(n[k]) || '—'}</td>`).join('')}
        <td><input class="celda-m ${esRoja(v) ? 'roja' : ''}" id="cm-${r}" value="${verNota(v)}" maxlength="3" autocomplete="off"
             inputmode="${ac ? 'text' : 'numeric'}" ${bloq ? 'disabled' : ''} aria-label="${esc(a.nombre)}, ${esc(d.materias[i])}"
             onfocus="focoCelda(${r})" oninput="cambioCelda(this, ${r})" onkeydown="teclaCelda(event, ${r})" onblur="confirmarCelda(${r})"></td>
        <td class="previa" id="pm-${r}" style="font-weight:700">${promFila(n)}</td>
        <td id="em-${r}">${vacia(v) ? '' : '<span class="est-m ok">Guardado</span>'}</td></tr>`;
    }).join('');
    const opciones = d.materias.map((m, k) => `<option value="${k}" ${k === i ? 'selected' : ''}>${esc(d.abreviaturas && d.abreviaturas[k] ? d.abreviaturas[k] + ' · ' : '')}${esc(m)}</option>`).join('');
    return `${barra('Capturar calificaciones', "ir('inicio')")}
      <div class="barra-filtros" style="background:var(--marino);padding:0 16px 14px;display:flex;flex-direction:column;gap:12px">
        <div class="chips">${gruposCal().map(g => `<button class="chip ${c.grupo === g ? 'activo' : ''}" onclick="cambiarGrupoMateria('${esc(g)}')">${esc(g)}</button>`).join('')}</div>
      </div>
      ${avisoCierre(d, p)}
      <div style="padding:16px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${modoCap('materia')}
        <label class="oculto" for="sel-materia">Materia</label>
        <select id="sel-materia" class="sel-m" onchange="cambiarMateria(this.value)">${opciones}</select>
        <div class="segmento cm-seg" role="group" aria-label="Periodo" style="flex:0 1 auto">
          ${[1, 2, 3].map(n => `<button class="${c.parcial === n ? 'activo' : ''}" onclick="cambiarPeriodoMateria(${n})">${PERIODOS[n - 1]}</button>`).join('')}</div>
        <span style="flex:1"></span><span class="sub" style="font-weight:700;color:var(--ok)" id="guardado-m">● Guardado automático</span>
      </div>
      <div class="cm-zona">
        <div class="tarjeta" style="padding:6px 14px;overflow:auto"><table class="cm-tabla">
          <tr><th>#</th><th>Alumno</th>${prev.map(k => `<th style="text-align:center">${PERIODOS[k]}</th>`).join('')}
            <th>${PERIODOS[p]}</th><th style="text-align:center">${p === 2 ? 'Prom. final' : p === 1 ? 'Prom. parcial' : ''}</th><th></th></tr>
          ${filas || '<tr><td colspan="6" class="vacio">No hay alumnos en este grupo.</td></tr>'}</table></div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="tarjeta teclas-m" style="padding:16px 18px"><b>Captura solo con teclado</b>

      });
      const foco = (items[S.bq.sel] && items[S.bq.sel].alumno) || (items[0] && items[0].alumno);
      if (foco) {
        const sec = 'ACCIONES PARA ' + esc(foco.nombre.toUpperCase());
        items.push({ sec, ic: '$', t: 'Registrar cobro', s: 'Mantenimiento y construcción', fn: () => nuevoCobro(foco.id) });
        items.push({ sec, ic: I.lapiz(16), t: 'Capturar calificaciones', s: 'Abrir su captura de materias y conducta', fn: () => calDeAlumno(foco.id, 'captura') });
        items.push({ sec, ic: I.boleta(16), t: 'Ver / imprimir boleta', s: 'Boleta oficial con promedios', fn: () => calDeAlumno(foco.id, 'boleta') });
        items.push({ sec, ic: I.ver(16), t: 'Ver ficha y adeudo', s: 'Pagos y datos del alumno', fn: () => abrirFicha(foco.id) });
      }
    }
    pantallas().filter(x => !q || quitarAcentos(x[0] + ' ' + x[1]).includes(q))
      .forEach(x => items.push({ sec: 'IR A', ic: x[2], t: x[0], s: x[1], fn: () => new Function(x[3])() }));
    return items;
  }
  window.abrirBuscador = function () {
    if (!S.datos) return;
    cerrarBuscador();
    const d = document.createElement('div');
    d.id = 'bg-over'; d.className = 'bg-over';
    d.addEventListener('mousedown', e => { if (e.target === d) cerrarBuscador(); });
    d.innerHTML = `<div class="bg-caja" role="dialog" aria-modal="true" aria-label="Buscador general">
      <div class="bg-entrada">${I.buscar(22)}<input id="bg-q" placeholder="Buscar alumno, grupo o pantalla…" autocomplete="off" aria-label="Buscar"><kbd>Esc</kbd></div>
      <div class="bg-res" id="bg-res" role="listbox"></div>
      <div class="bg-pie"><span><kbd>Ctrl K</kbd> abre desde cualquier pantalla</span><span><kbd>↑ ↓</kbd> moverse</span><span><kbd>Enter</kbd> abrir</span></div></div>`;
    document.body.appendChild(d);
    S.bq = { q: '', sel: 0, items: [] };
    const inp = d.querySelector('#bg-q');
    inp.addEventListener('input', () => { S.bq.q = inp.value; S.bq.sel = 0; pintarBuscador(); });
    inp.addEventListener('keydown', e => {
      const n = S.bq.items.length;
      if (e.key === 'ArrowDown') { e.preventDefault(); S.bq.sel = n ? (S.bq.sel + 1) % n : 0; pintarBuscador(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); S.bq.sel = n ? (S.bq.sel - 1 + n) % n : 0; pintarBuscador(); }
      else if (e.key === 'Enter') { e.preventDefault(); ejecutarBuscador(S.bq.sel); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cerrarBuscador(); }
    });
    pintarBuscador();
    inp.focus();
  };
  function pintarBuscador() {
    const caja = document.getElementById('bg-res'); if (!caja) return;
    const selAntes = S.bq.items[S.bq.sel];
    S.bq.items = itemsBuscador();
    if (selAntes && selAntes.alumno) { const k = S.bq.items.findIndex(x => x.alumno === selAntes.alumno); if (k >= 0) S.bq.sel = k; }
    if (S.bq.sel >= S.bq.items.length) S.bq.sel = 0;
    let sec = '';
    caja.innerHTML = S.bq.items.map((x, i) => {
      const h = x.sec !== sec ? `<div class="bg-sec">${x.sec}</div>` : '';
      sec = x.sec;
      return h + `<button class="bg-item ${i === S.bq.sel ? 'sel' : ''}" role="option" onmouseenter="selBuscador(${i})" onclick="ejecutarBuscador(${i})">
        <span class="ic">${x.ic}</span><span><b>${x.t}</b><small>${x.s}</small></span><span class="enter">Enter ↵</span></button>`;
    }).join('') || `<div class="vacio">No hay resultados para "${esc(S.bq.q)}".</div>`;
    const s = caja.querySelector('.bg-item.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  }
  window.selBuscador = function (i) {
    if (S.bq.sel === i) return;
    S.bq.sel = i;
    if (S.bq.items[i] && S.bq.items[i].alumno) pintarBuscador();
    else document.querySelectorAll('.bg-item').forEach((b, k) => b.classList.toggle('sel', k === i));
  };
  window.ejecutarBuscador = function (i) { const x = S.bq.items[i]; if (!x) return; cerrarBuscador(); x.fn(); };
  window.cerrarBuscador = function () { const d = document.getElementById('bg-over'); if (d) d.remove(); };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      if (!S.datos || S.vista === 'login') return;
      e.preventDefault();
      if (document.getElementById('bg-over')) cerrarBuscador(); else abrirBuscador();
    }
  }, true);
  window.addEventListener('beforeunload', e => {
    if (S.cal.cola && Object.keys(S.cal.cola).length) { enviarCola(); e.preventDefault(); e.returnValue = ''; }
  });
})();
</script><script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
